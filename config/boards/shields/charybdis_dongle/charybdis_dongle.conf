# 동글에는 실제 RGB LED가 없으므로 charybdis.conf에서 상속된 언더글로우 설정을 끕니다
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_LED_STRIP=n

# 동글에는 인코더가 없습니다
CONFIG_EC11=n

# 디스플레이
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y

# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# BLE
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# 3 프로필 (n+2), central + 2 peripheral(좌/우)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 봉고캣 위젯이 타이핑 속도(WPM)를 기반으로 동작합니다
CONFIG_ZMK_WPM=y

# 커스텀 상태화면은 zmk 기본 4096 메모리풀이 자동 적용 안 되므로 명시적으로 늘려줍니다
CONFIG_LV_Z_MEM_POOL_SIZE=8192

CONFIG_ZMK_POINTING=y

# 동글(중앙) 자체 배터리도 표시
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# 소프트오프 (깨우기는 리셋 버튼 1회 누름으로만 가능 - 매트릭스가 없어 GPIO 키 웨이크업 불가)
# CONFIG_ZMK_PM_SOFT_OFF=y
 
# 딥슬립 (동글은 물리 키가 없어 무입력 시 자동 진입만 되고, 깨울 때는 리셋 버튼 1회 필요)
# 좌/우보다 길게 잡아서 잦은 리셋 버튼 조작을 방지 (1시간)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000